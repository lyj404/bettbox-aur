name: Update AUR Package

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'

concurrency:
  group: update-aur
  cancel-in-progress: false

jobs:
  update-version:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for new release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_tag=""
          while IFS= read -r tag; do
            case "$tag" in *-*) continue ;; esac
            asset_count=$(gh release view "$tag" \
              --repo appshubcc/Bettbox \
              --json assets \
              --jq '[.assets[] | select(.name | test("linux-amd64\\.deb$"))] | length')
            if [ "$asset_count" -gt 0 ]; then
              latest_tag="$tag"
              break
            fi
          done < <(gh release list \
            --repo appshubcc/Bettbox \
            --limit 30 \
            --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName')

          if [ -z "$latest_tag" ]; then
            echo "No upstream stable releases found"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_ver="${latest_tag#v}"
          # 以 AUR 上已发布的版本为准，避免推送 AUR 失败后被本仓库的 pkgver 卡住
          current_ver=$(curl -fsS 'https://aur.archlinux.org/rpc/v5/info?arg[]=bettbox-bin' \
            | jq -r '.results[0].Version' | sed 's/-[^-]*$//')

          if [[ "$latest_ver" == "$current_ver" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=$latest_ver" >> "$GITHUB_OUTPUT"
            echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          fi

      # 在 Update PKGBUILD 之前克隆 AUR，把 AUR 打包文件覆盖到本仓库后用 git diff 对比：
      # 此时本仓库还未被 sed 改写，对比的是两侧"任何改动"而非版本号。
      # 只要有任何差异（不限版本更新），直接失败任务，交由人工核对，
      # 避免自动判断合并方向而出错（AUR 领先 / 本地改动尚未同步都可能是原因）
      - name: Fetch AUR state
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail

          # 配置 SSH
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

          cat >> ~/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

          # 克隆 AUR 仓库供后续推送
          git clone ssh://aur@aur.archlinux.org/bettbox-bin.git /tmp/aur-bettbox-bin

          # 覆盖本仓库工作区后再 git diff：任何差异都视为漂移（drift），直接 fail
          rsync -a --exclude '.git' /tmp/aur-bettbox-bin/ ./
          if ! git diff --quiet; then
            echo "Error: AUR 上的打包文件与本仓库不一致，请人工核对并同步后再运行"
            echo "git diff GitHub..AUR："
            git diff || true
            exit 1
          fi

      - name: Update PKGBUILD
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          NEW_VER: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail

          sha_amd64=$(gh release view "$TAG" \
            --repo appshubcc/Bettbox \
            --json assets \
            --jq '[.assets[] | select(.name | endswith("linux-amd64.deb")) | .digest] | first' | \
            sed 's/^sha256://')
          sha_arm64=$(gh release view "$TAG" \
            --repo appshubcc/Bettbox \
            --json assets \
            --jq '[.assets[] | select(.name | endswith("linux-arm64.deb")) | .digest] | first' | \
            sed 's/^sha256://')

          sed -i "s|^pkgver=.*|pkgver=${NEW_VER}|" PKGBUILD
          sed -i "s|^pkgrel=.*|pkgrel=1|" PKGBUILD
          sed -i "s|^sha256sums_x86_64=.*|sha256sums_x86_64=('${sha_amd64}')|" PKGBUILD
          sed -i "s|^sha256sums_aarch64=.*|sha256sums_aarch64=('${sha_arm64}')|" PKGBUILD

      - name: Generate .SRCINFO
        if: steps.check.outputs.skip != 'true'
        run: |
          # 纯 bash 生成 .SRCINFO（无 docker / Arch 容器 / makepkg），
          # 输出与 `makepkg --printsrcinfo` 字节一致
          ./.github/mksrcinfo/mksrcinfo.sh "$PWD" > .SRCINFO

      # 先推 AUR 再推 GitHub：若推送 AUR 失败，本仓库保持原样，避免两侧 PKGBUILD 内容不同步
      # 仅在版本更新时（skip=false）推送；skip=true 时两侧已被 Fetch AUR state 校验过，无差异可推
      - name: Push to AUR
        if: steps.check.outputs.skip != 'true'
        env:
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
        run: |
          set -euo pipefail

          cd /tmp/aur-bettbox-bin
          git config user.email "${AUR_USERNAME}@users.noreply.github.com"
          git config user.name "$AUR_USERNAME"

          cp "$GITHUB_WORKSPACE/PKGBUILD" "$GITHUB_WORKSPACE/.SRCINFO" "$GITHUB_WORKSPACE/restart-bettbox.hook" ./

          if git diff --quiet -- PKGBUILD .SRCINFO restart-bettbox.hook; then
            echo "No changes to sync to AUR"
            exit 0
          fi

          # 步骤已由 `skip != 'true'` 门控，走到这里必有版本更新
          title="Update to version $(sed -n 's/^pkgver=//p' PKGBUILD)"

          git add PKGBUILD .SRCINFO restart-bettbox.hook
          git commit -m "$title"
          git push origin master

      - name: Commit and push to GitHub
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # AUR 差异已在 Fetch AUR state 失败，此处只提交本仓库改动
          git add PKGBUILD .SRCINFO restart-bettbox.hook
          if git diff --cached --quiet; then
            echo "No changes to commit on GitHub"
            exit 0
          fi

          if [ "${{ steps.check.outputs.skip }}" = "true" ]; then
            git commit -m "Update packaging files"
          else
            git commit -m "Update to version ${{ steps.check.outputs.version }}"
          fi
          git push

  push-modifications:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PKGBUILD and .SRCINFO consistency
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          # 仅当该 push 实际修改了打包文件（PKGBUILD/.SRCINFO）时做一致性校验；
          # 只改 LICENSE/README/hook 等其他文件时跳过校验，照常推送到 AUR
          if ! git diff --quiet "$BEFORE" "$AFTER" -- PKGBUILD .SRCINFO; then

            # 用仓库内 vendored 纯 bash 生成器从当前 PKGBUILD 现场生成 .SRCINFO，
            # 与提交的 .SRCINFO 做内容 diff，而非依赖 pkgrel 是否递增
            ./.github/mksrcinfo/mksrcinfo.sh "$PWD" > /tmp/expected.SRCINFO
            if ! diff -q .SRCINFO /tmp/expected.SRCINFO >/dev/null 2>&1; then
              echo "Error: .SRCINFO 与当前 PKGBUILD 不一致，请重新生成并提交："
              echo "  ./.github/mksrcinfo/mksrcinfo.sh \"\$PWD\" > .SRCINFO"
              echo "内容差异："
              diff -u .SRCINFO /tmp/expected.SRCINFO | head -40 || true
              exit 1
            fi

            # 仅提示（不做强制）：打包内容影响产物时应递增 pkgrel，便于 AUR 触发更新
            new_vr=$(sed -n 's/^pkgver=//p' PKGBUILD)-$(sed -n 's/^pkgrel=//p' PKGBUILD)
            old_vr=$(git show "$BEFORE:PKGBUILD" | sed -n 's/^pkgver=//p')-$(git show "$BEFORE:PKGBUILD" | sed -n 's/^pkgrel=//p')
            if [ "$new_vr" = "$old_vr" ]; then
              echo "Hint: pkgver-pkgrel 未变化。若打包改动影响产物，建议按 Arch wiki 递增 pkgrel"
            fi

            echo "PKGBUILD / .SRCINFO consistency check passed"
          else
            # 非打包文件改动（LICENSE/README/hook 等）：无需重新生成 .SRCINFO，
            # push-to-aur 会全量 rsync 推送，保持 AUR 与仓库一致
            echo "No changes to PKGBUILD or .SRCINFO, skipping validation"
          fi

      - name: Push to AUR
        uses: ./.github/actions/push-to-aur
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_KEY }}
          package-name: bettbox-bin
          commit-message: ${{ join(github.event.commits.*.message, '\n---\n') }}
          user-name: ${{ secrets.AUR_USERNAME }}
          user-email: ${{ secrets.AUR_USERNAME }}@users.noreply.github.com
