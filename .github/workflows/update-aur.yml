name: Update AUR Package

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'

concurrency:
  group: update-aur
  cancel-in-progress: false

jobs:
  update-version:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for new release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_tag=""
          while IFS= read -r tag; do
            case "$tag" in *-*) continue ;; esac
            asset_count=$(gh release view "$tag" \
              --repo appshubcc/Bettbox \
              --json assets \
              --jq '[.assets[] | select(.name | test("linux-amd64\\.deb$"))] | length')
            if [ "$asset_count" -gt 0 ]; then
              latest_tag="$tag"
              break
            fi
          done < <(gh release list \
            --repo appshubcc/Bettbox \
            --limit 30 \
            --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName')

          if [ -z "$latest_tag" ]; then
            echo "No upstream stable releases found"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_ver="${latest_tag#v}"
          # 以 AUR 上已发布的版本为准，避免推送 AUR 失败后被本仓库的 pkgver 卡住
          current_ver=$(curl -fsS 'https://aur.archlinux.org/rpc/v5/info?arg[]=bettbox-bin' \
            | jq -r '.results[0].Version' | sed 's/-[^-]*$//')

          if [[ "$latest_ver" == "$current_ver" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=$latest_ver" >> "$GITHUB_OUTPUT"
            echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Update PKGBUILD
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          NEW_VER: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail

          sha_amd64=$(gh release view "$TAG" \
            --repo appshubcc/Bettbox \
            --json assets \
            --jq '[.assets[] | select(.name | endswith("linux-amd64.deb")) | .digest] | first' | \
            sed 's/^sha256://')
          sha_arm64=$(gh release view "$TAG" \
            --repo appshubcc/Bettbox \
            --json assets \
            --jq '[.assets[] | select(.name | endswith("linux-arm64.deb")) | .digest] | first' | \
            sed 's/^sha256://')

          sed -i "s|^pkgver=.*|pkgver=${NEW_VER}|" PKGBUILD
          sed -i "s|^pkgrel=.*|pkgrel=1|" PKGBUILD
          sed -i "s|^sha256sums_x86_64=.*|sha256sums_x86_64=('${sha_amd64}')|" PKGBUILD
          sed -i "s|^sha256sums_aarch64=.*|sha256sums_aarch64=('${sha_arm64}')|" PKGBUILD

      - name: Generate .SRCINFO
        if: steps.check.outputs.skip != 'true'
        run: |
          # 纯 bash 生成 .SRCINFO（无 docker / Arch 容器 / makepkg），
          # 输出与 `makepkg --printsrcinfo` 字节一致
          ./.github/mksrcinfo/mksrcinfo.sh "$PWD" > .SRCINFO

      # 先推 AUR 再推 GitHub：若推送 AUR 失败，本仓库保持原样，避免两侧 PKGBUILD 内容不同步
      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
        run: |
          set -euo pipefail

          # 配置 SSH
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

          cat >> ~/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

          # 克隆 AUR 仓库用于对比与推送
          git clone ssh://aur@aur.archlinux.org/bettbox-bin.git /tmp/aur-bettbox
          cd /tmp/aur-bettbox
          git config user.email "${AUR_USERNAME}@users.noreply.github.com"
          git config user.name "$AUR_USERNAME"

          repo_ver=$(sed -n 's/^pkgver=//p' "$GITHUB_WORKSPACE/PKGBUILD")
          repo_rel=$(sed -n 's/^pkgrel=//p' "$GITHUB_WORKSPACE/PKGBUILD")
          aur_ver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          aur_rel=$(sed -n 's/^pkgrel=//p' PKGBUILD)

          # AUR 已领先本仓库时（如上次推送 GitHub 失败），不推送，避免把 AUR 回退
          if [ "$aur_ver-$aur_rel" != "$repo_ver-$repo_rel" ] && \
             [ "$(printf '%s\n%s\n' "$aur_ver-$aur_rel" "$repo_ver-$repo_rel" | sort -V | tail -1)" = "$aur_ver-$aur_rel" ]; then
            echo "AUR ($aur_ver-$aur_rel) is ahead of repo ($repo_ver-$repo_rel), skip to avoid downgrade"
            exit 0
          fi

          cp "$GITHUB_WORKSPACE/PKGBUILD" "$GITHUB_WORKSPACE/.SRCINFO" "$GITHUB_WORKSPACE/restart-bettbox.hook" ./

          if git diff --quiet -- PKGBUILD .SRCINFO restart-bettbox.hook; then
            echo "No changes to sync to AUR"
            exit 0
          fi

          # 定时路径只处理版本更新；skip=true 时若仍有差异（如 push-modifications 推送 AUR 失败后），
          # 顺手把手工改动补推到 AUR，.SRCINFO 由本地维护者生成并已提交，无需再现场重算
          if [ "${{ steps.check.outputs.skip }}" = "true" ]; then
            title="Sync packaging changes from GitHub"
          else
            title="Update to version ${repo_ver}"
          fi

          # 附上本仓库涉及打包文件的提交记录，提升 AUR 提交的可审计性
          body=$(git -C "$GITHUB_WORKSPACE" log -20 --format='- %s (%h)' \
            -- PKGBUILD .SRCINFO restart-bettbox.hook | grep -v '^\- Update to version' || true)

          git add PKGBUILD .SRCINFO restart-bettbox.hook
          if [ -n "$body" ]; then
            git commit -m "$title" -m "$body"
          else
            git commit -m "$title"
          fi
          git push origin master

      - name: Commit and push to GitHub
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 若 AUR 领先（如上次推送 GitHub 失败），以 AUR 为准补回本仓库，保证两侧一致
          aur_vr=$(sed -n 's/^pkgver=//p' /tmp/aur-bettbox/PKGBUILD)-$(sed -n 's/^pkgrel=//p' /tmp/aur-bettbox/PKGBUILD)
          repo_vr=$(sed -n 's/^pkgver=//p' PKGBUILD)-$(sed -n 's/^pkgrel=//p' PKGBUILD)
          if [ "$aur_vr" != "$repo_vr" ] && \
             [ "$(printf '%s\n%s\n' "$aur_vr" "$repo_vr" | sort -V | tail -1)" = "$aur_vr" ]; then
            echo "AUR ($aur_vr) is ahead of repo ($repo_vr), syncing GitHub from AUR"
            cp /tmp/aur-bettbox/PKGBUILD /tmp/aur-bettbox/.SRCINFO /tmp/aur-bettbox/restart-bettbox.hook ./
            git add PKGBUILD .SRCINFO restart-bettbox.hook
            git commit -m "Sync from AUR"
            git push
            exit 0
          fi

          git add PKGBUILD .SRCINFO restart-bettbox.hook
          if git diff --cached --quiet; then
            echo "No changes to commit on GitHub"
            exit 0
          fi

          if [ "${{ steps.check.outputs.skip }}" = "true" ]; then
            git commit -m "Update packaging files"
          else
            git commit -m "Update to version ${{ steps.check.outputs.version }}"
          fi
          git push

  push-modifications:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure pkgrel changed
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          # Check there is a diff in PKGBUILD or .SRCINFO
          git diff "$BEFORE" "$AFTER" -- PKGBUILD .SRCINFO > /dev/null 2>&1 || {
            echo "Error: no changes to PKGBUILD or .SRCINFO in this push"
            exit 1
          }

          # Extract the new pkgrel value from each file
          pkgrel_pkgbuild=$(git diff "$BEFORE" "$AFTER" -- PKGBUILD | sed -n 's/^+pkgrel=//p')
          pkgrel_srcinfo=$(git diff "$BEFORE" "$AFTER" -- .SRCINFO | sed -n 's/^+[[:space:]]*pkgrel[[:space:]]*=[[:space:]]*//p')

          # Verify both files modified pkgrel
          [ -n "$pkgrel_pkgbuild" ] || { echo "Error: pkgrel not modified in PKGBUILD"; exit 1; }
          [ -n "$pkgrel_srcinfo" ] || { echo "Error: pkgrel not modified in .SRCINFO"; exit 1; }

          # Verify they match
          [ "$pkgrel_pkgbuild" = "$pkgrel_srcinfo" ] || {
            echo "Error: pkgrel mismatch - PKGBUILD has '$pkgrel_pkgbuild', .SRCINFO has '$pkgrel_srcinfo'"
            exit 1
          }

          echo "pkgrel consistency check passed: pkgrel=$pkgrel_pkgbuild"

      - name: Push to AUR
        uses: ./.github/actions/push-to-aur
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_KEY }}
          package-name: bettbox-bin
          commit-message: ${{ join(github.event.commits.*.message, '\n---\n') }}
          user-name: ${{ secrets.AUR_USERNAME }}
          user-email: ${{ secrets.AUR_USERNAME }}@users.noreply.github.com